name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Repo chưa có gradlew nên dùng Gradle cài sẵn, cùng phiên bản với gradle-wrapper.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Khóa ký cố định: để SHA-1 không đổi giữa các lần build, OAuth client của Google luôn khớp.
      # Cần 4 secret: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Không có secret thì build debug bằng khóa debug mặc định của runner (SHA-1 sẽ đổi mỗi lần).
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Không có secret KEYSTORE_BASE64, build bằng khóa debug mặc định."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/DocumentsHub-debug.apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/DocumentsHub-release.apk
          fi
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DocumentsHub-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
