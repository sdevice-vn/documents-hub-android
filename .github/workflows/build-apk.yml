name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle wrapper
        id: wrapper
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Dùng khi repo chưa có gradlew / gradle-wrapper.jar
      - name: Set up Gradle (no wrapper in repo)
        if: steps.wrapper.outputs.present == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Gradle cache (wrapper in repo)
        if: steps.wrapper.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (wrapper)
        if: steps.wrapper.outputs.present == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build debug APK (system Gradle)
        if: steps.wrapper.outputs.present == 'false'
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found: $APK"
          mkdir -p dist
          cp "$APK" dist/DocumentsHub-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentsHub-debug-apk
          path: dist/DocumentsHub-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DocumentsHub-debug.apk
